name: openreader-qwen3-tts

services:
  openreader:
    image: openreader:qwen
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:3003}
      AUTH_SECRET: ${AUTH_SECRET:-local-openreader-auth-secret-change-me}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      USE_ANONYMOUS_AUTH_SESSIONS: ${USE_ANONYMOUS_AUTH_SESSIONS:-true}
      COMPUTE_WORKER_HOST: 0.0.0.0
      COMPUTE_WORKER_PUBLIC_URL: ${COMPUTE_WORKER_PUBLIC_URL:-http://localhost:8081}
      TTS_PLAYBACK_TOKEN_SECRET: ${TTS_PLAYBACK_TOKEN_SECRET:-local-tts-playback-token-secret}
      COMPUTE_PDF_TIMEOUT_MS: ${COMPUTE_PDF_TIMEOUT_MS:-3600000}
      COMPUTE_PDF_JOB_ATTEMPTS: ${COMPUTE_PDF_JOB_ATTEMPTS:-2}
      COMPUTE_PREWARM_MODELS: ${COMPUTE_PREWARM_MODELS:-true}
      RUNTIME_SEED_JSON: |-
        {
          "version": 1,
          "runtimeConfig": {
            "defaultTtsProvider": "qwen3-tts-local"
          },
          "providers": [
            {
              "slug": "qwen3-tts-local",
              "displayName": "Qwen3-TTS 0.6B (local GPU)",
              "providerType": "custom-openai",
              "baseUrl": "http://host.docker.internal:8881/v1",
              "defaultModel": "qwen3-tts-06b-customvoice",
              "enabled": true
            }
          ]
        }
    ports:
      - "3003:3003"
      - "8333:8333"
      - "8081:8081"
    volumes:
      - openreader-docstore:/app/docstore

volumes:
  openreader-docstore:
